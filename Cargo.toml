[package]
name = "honeypot"
version = "0.1.0"
edition = "2024"
# `cargo run` runs the honeypot. The report tool from Stage 9 is `cargo run --bin report`.
default-run = "honeypot"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
