name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --locked --verbose
      # Stages 8 to 10 were left as exercises, so their exercise tests fail until someone writes
      # them. Their guard tests still run, along with every test from Stages 1 to 7. Remove the
      # three --skip flags once the exercises are done.
      - name: Run tests
        run: >
          cargo test --locked --verbose --
          --skip fake_web::tests::ex
          --skip report::tests::ex
          --skip services::tests::ex
      - name: Audit dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit
